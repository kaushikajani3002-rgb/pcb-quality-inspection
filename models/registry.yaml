# PCB AOI Model Registry
# This file tracks all trained model weights in the repository.

models:
  component_detector:
    name: "Component"
    path: "models/trained/Component/All_cercit_finetuned_best.pt"
    purpose: "PCB component detection (IC, LED, Resistor, Capacitor, Connector, Crystal, Fuse, etc.)"
    base_weights: "yolo11m.pt"
    training_script: "training/component_detection/train_component_yolo.py"
    dataset: "Master_PCB_Dataset"
    status: "trained"
    version: "v2.0"

  deeppcb:
    name: "DeepPCB"
    path: "models/trained/DeepPCB/DeepPCB.pt"
    purpose: "Trace defect detection for Arduino Uno and standard PCBs"
    training_script: "training/defect_detection/finetune_defect_yolo.py"
    dataset: "DeepPCB"
    classes: [open, short, mousebite, spur, copper, pin_hole]
    status: "trained"
    version: "v1.0"

  dspcbsd:
    name: "DsPCBSD+"
    path: "models/trained/DsPCBSD+/DsPCBSD+.pt"
    purpose: "9-class PCB defect detection and segmentation for ESP32 DevKit"
    training_script: "training/defect_detection/finetune_defect_yolo.py"
    dataset: "DsPCBSD+"
    classes: [SH, SP, SC, OP, MB, HB, CS, CFO, BMFO]
    status: "trained"
    version: "v1.0"

  hripcb:
    name: "HRIPCB"
    path: "models/trained/HRIPCB/HRIPCB.pt"
    purpose: "High-resolution PCB defect detection for STM32 Blue Pill"
    training_script: "training/defect_detection/finetune_defect_yolo.py"
    dataset: "HRIPCB"
    classes: [missing_hole, mouse_bite, open_circuit, short, spur, spurious_copper]
    status: "trained"
    version: "v1.0"

  tddpcb:
    name: "TDD-PCB"
    path: "models/trained/TDD-PCB/PDD-PCB-best.pt"
    purpose: "Aligned-board defect detection for Generic PCB"
    training_script: "training/defect_detection/finetune_defect_yolo.py"
    dataset: "TDD-PCB"
    classes: [missing_hole, mouse_bite, open_circuit, short, spur, spurious_copper]
    status: "trained"
    version: "v1.0"
